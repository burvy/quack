[package]
name = "quack-app"
description = "Tauri app, runs on desktop, Android"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# rlib for rust-linkable (rust compiled), cdylib for android (dynamically linked)
# I don't have a Mac so I won't be using staticlib which is for IOS
name = "quack_app_lib"
crate-type = ["rlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
